bio: |
  I am a Full Professor at the <strong>Department of Electronics, Information and Bioengineering</strong> of Politecnico di Milano and a member of its Artificial Intelligence and Robotics Laboratory.

  My research lies at the intersection of <strong>robotics</strong>, <strong>machine learning</strong>, <strong>computer vision</strong>, and <strong>pattern recognition</strong>. I develop and evaluate learning and perception methods for autonomous physical and software systems, especially when they must act under uncertainty or with incomplete knowledge.

  Autonomous robots, intelligent vehicles, agricultural robotics, assistive technologies, and intelligent data analysis provide the real-world settings for this work. I am also deeply involved in teaching, doctoral supervision, research coordination, benchmarking, and technology transfer.

